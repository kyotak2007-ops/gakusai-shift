<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>one make たこ焼き</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f5f6f8;color:#222}
header{background:#222;color:#fff;padding:14px 16px;font-size:20px;font-weight:700}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd}
nav button{flex:1;border:0;background:#fff;padding:14px 6px;font-size:15px}
nav button.active{font-weight:700;border-bottom:3px solid #222}
.page{display:none;padding:14px;max-width:1100px;margin:auto}
.page.active{display:block}
.date-tabs{display:flex;gap:6px;margin-bottom:12px}
.date-tabs button{flex:1;padding:11px 5px;border:1px solid #bbb;border-radius:8px;background:#fff;font-weight:600}
.date-tabs button.active{background:#222;color:#fff}
.table-wrap{overflow:auto;background:#fff;border-radius:10px;box-shadow:0 1px 4px #ddd}
table{border-collapse:collapse;width:100%;min-width:850px}
th,td{border:1px solid #d5d5d5;text-align:center;height:46px;padding:5px}
th{background:#eee;position:sticky;top:0;z-index:2}
.time{font-weight:700;background:#f7f7f7;position:sticky;left:0;z-index:1;white-space:nowrap}
.shift-cell{min-width:92px;cursor:pointer}
.shift-cell.available{background:#dff3e3}
.shift-cell.assigned{background:#d8e8ff;font-weight:700}
.hint{color:#666;font-size:13px;margin:8px 0 14px}
.member-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.member-btn{background:#fff;border:1px solid #ccc;border-radius:10px;padding:14px 10px;font-size:16px;text-align:left;cursor:pointer}
.member-btn:hover{background:#f0f0f0}
.add-row{display:flex;gap:8px;margin-bottom:14px}
.add-row input{flex:1;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:16px}
.add-row button,.primary{padding:12px 18px;border:0;border-radius:8px;background:#222;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.member-detail{display:none}
.member-detail.active{display:block}
.back{border:0;background:none;padding:5px 0 12px;font-size:15px;cursor:pointer}
.member-title{font-size:20px;font-weight:700;margin:4px 0}
.personal-table{min-width:720px}
.personal-table th.date-head{min-width:180px}
.personal-cell{height:48px;cursor:pointer;background:#fff}
.personal-cell.selected{background:#ccefd4}
.personal-cell.selected::after{content:"勤務可";font-size:12px;font-weight:700}
.register-area{margin-top:14px;background:#fff;padding:14px;border-radius:10px;box-shadow:0 1px 4px #ddd}
.register-area button{width:100%;padding:14px;border:0;border-radius:9px;background:#222;color:#fff;font-size:17px;font-weight:700}
.status{margin-top:9px;text-align:center;font-size:13px;color:#555}
.danger{margin-top:8px;background:#fff;color:#c00;border:1px solid #ddd;border-radius:8px;padding:8px 12px;cursor:pointer}
.small{font-size:12px;color:#666}

.admin-panel{background:#fff;padding:14px;border-radius:10px;box-shadow:0 1px 4px #ddd;margin-bottom:14px}
.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.admin-grid label{display:block;font-size:13px;color:#666;margin-bottom:4px}
.admin-grid select{width:100%;padding:11px;border:1px solid #bbb;border-radius:8px;font-size:15px;background:#fff}
.candidate-title{font-weight:700;margin:16px 0 8px}
.candidate-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.candidate{padding:9px 14px;border:1px solid #aaa;border-radius:20px;background:#fff}
.candidate.selected{background:#ccefd4;border:2px solid #222}
.primary{width:100%;margin-top:4px}
.clear{width:100%;margin-top:8px;padding:10px;border:1px solid #bbb;border-radius:8px;background:#fff}
.admin-table{min-width:900px}
.admin-cell{min-width:100px;cursor:pointer}
.admin-cell.assigned{background:#d8e8ff;font-weight:700}
@media(max-width:600px){.admin-grid{grid-template-columns:1fr}}

.personal-cell.confirmed{
  background:#d8e8ff !important;
  border:2px solid #4d86c5;
  font-weight:800;
}
.personal-cell.confirmed::after{
  content:"シフト確定";
  font-size:12px;
}
.personal-cell.selected:not(.confirmed)::after{
  content:"勤務可";
  font-size:12px;
  font-weight:700;
}
.confirmed-note{
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  background:#eef6ff;
  font-size:13px;
}
</style>
<style>
.member-grade{font-size:11px;padding:3px 6px;border-radius:10px;margin-left:5px}
.grade-1-cell{background:#e3f2fd!important}.grade-2-cell{background:#e8f5e9!important}
.grade-3-cell{background:#fff3e0!important}.grade-4-cell{background:#f3e5f5!important}
.grade-5-cell{background:#fce4ec!important}.grade-6-cell{background:#ede7f6!important}
.grade-exec-cell{background:#ffe0b2!important;font-weight:800}
</style>

@media(max-width:380px){

  header{font-size:18px;padding:12px;}

  .member-grade{font-size:10px;}

</style>

<body>
<header>one make たこ焼き</header><div id="syncStatus" style="background:#fff;padding:7px 12px;text-align:center;font-size:12px;color:#666;border-bottom:1px solid #ddd">Firebase接続中…</div>

<nav>
  <button id="navSchedule" class="active" onclick="showPage('schedule')">シフト表</button>
  <button id="navMembers" onclick="showPage('members')">メンバー</button>
<button id="navAdmin" onclick="showPage('admin')">管理者</button>
</nav>

<section id="schedule" class="page active">
  <div class="bulletin">
    <div class="bulletin-title">📌 掲示板</div>
    <textarea id="bulletinText" placeholder="今必要なもの・連絡事項などを自由に書いてください"></textarea>
    <button class="bulletin-save" onclick="saveBulletin()">掲示板を更新</button>
    <div id="bulletinStatus" class="bulletin-status"></div>
  </div>
  <h2>シフト表</h2>
  <div class="date-tabs" id="scheduleDates"></div>
  <p class="hint">横軸が担当場所、縦軸が時間です。登録された勤務可能時間を確認できます。</p>
  <div class="table-wrap"><table id="scheduleTable"></table></div>
</section>

<section id="members" class="page">
  <div id="memberListView">
    <h2>メンバー</h2>
    <div class="add-row" style="flex-wrap:wrap">
      <input id="memberName" placeholder="名前を入力">
      <select id="memberGrade" style="padding:12px;border:1px solid #bbb;border-radius:8px;font-size:16px">
        <option value="1年">1年</option><option value="2年">2年</option>
        <option value="3年">3年</option><option value="4年">4年</option>
        <option value="5年">5年</option><option value="6年">6年</option>
        <option value="幹部">幹部</option>
      </select>
      <button onclick="addMember()">追加</button>
    </div>
    <div class="member-list" id="memberList"></div>
    <p class="hint">名前を押すと、その人専用の勤務可能時間入力画面が開きます。</p>
  </div>

  <div id="memberDetailView" class="member-detail">
    <button class="back" onclick="closeMember()">← メンバー一覧に戻る</button>
    <div class="member-title" id="memberTitle"></div>
    <p class="hint">勤務できる時間をタップして緑色にしてください。最後に「登録」を押してください。</p>
    <div class="table-wrap"><table id="personalTable" class="personal-table"></table></div>
    <div class="register-area">
      <button onclick="registerAvailability()">登録</button>
      <div class="status" id="registerStatus"></div>
    </div>
    <button class="danger" onclick="deleteCurrentMember()">このメンバーを削除</button>
  </div>
</section>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5OheiN9AYsGNJ2btxpwsVTgorCSe2foY",
  authDomain: "one-make-oct.firebaseapp.com",
  projectId: "one-make-oct",
  storageBucket: "one-make-oct.firebasestorage.app",
  messagingSenderId: "128887741295",
  appId: "1:128887741295:web:529c13e024dceac0fde69a",
  measurementId: "G-CJJSF8G2YC"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<script>
const DATES=["10/30","10/31","11/1"];
const TIMES=[];
for(let h=10;h<19;h++) TIMES.push(`${h}:00〜${h+1}:00`);
const POSITIONS=["会計1","会計2","焼き1","焼き2","焼き3","焼き4","焼き5","焼き6","焼き7","焼き8","渡し係","客引き係","生地係1","生地係2"];

let members=[];
let availability={};
let assignments={};
let memberGrades={};
let bulletin="";
let currentDate=DATES[0];
let currentMember=null;
let adminSelectedMember="";

async function save(){
  try{
    await db.collection("app").doc("state").set({
      members: members,
      availability: availability,
      assignments: assignments,
      memberGrades: memberGrades,
      bulletin: bulletin,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    setSyncStatus("共有データに保存しました");
  }catch(e){
    console.error(e);
    setSyncStatus("保存に失敗しました。Firebaseの設定を確認してください。", true);
    alert("データの保存に失敗しました。\n" + e.message);
  }
}
function setSyncStatus(msg,error=false){
  const el=document.getElementById("syncStatus");
  if(el){el.textContent=msg;el.style.color=error?"#b00020":"#555";}
}
async function loadCloudData(){
  try{
    const snap=await db.collection("app").doc("state").get();
    if(snap.exists){
      const data=snap.data();
      members=Array.isArray(data.members)?data.members:[];
      availability=data.availability||{};
      assignments=data.assignments||{};
      memberGrades=data.memberGrades||{};
      bulletin=typeof data.bulletin==="string"?data.bulletin:"";
    }
    setSyncStatus("共有データに接続中");
    renderSchedule();
    renderMembers();
    if(document.getElementById("admin").classList.contains("active")) renderAdmin();
  }catch(e){
    console.error(e);
    setSyncStatus("Firebaseに接続できません",true);
  }
}
db.collection("app").doc("state").onSnapshot(snap=>{
  if(!snap.exists)return;
  const data=snap.data();
  members=Array.isArray(data.members)?data.members:[];
  availability=data.availability||{};
  assignments=data.assignments||{};
  memberGrades=data.memberGrades||{};
  bulletin=typeof data.bulletin==="string"?data.bulletin:"";
  renderBulletin();
  renderSchedule();
  renderMembers();
  if(document.getElementById("admin").classList.contains("active")) renderAdmin();
  setSyncStatus("最新データを表示中");
},e=>{
  console.error(e);
  setSyncStatus("Firebase接続エラー",true);
});

function showPage(page){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 document.getElementById(page).classList.add("active");
 const navId=page==="schedule"?"navSchedule":page==="members"?"navMembers":"navAdmin";
 document.getElementById(navId).classList.add("active");
 if(page==="schedule")renderSchedule();
 if(page==="members")renderMembers();
 if(page==="admin"){checkAdminLogin(); if(sessionStorage.getItem("one_make_admin")==="1"){setupAdmin();renderAdmin();}}
}

function renderDateTabs(id,callback){
 const box=document.getElementById(id);box.innerHTML="";
 DATES.forEach(d=>{
  const b=document.createElement("button");
  b.textContent=d;
  if(d===currentDate)b.classList.add("active");
  b.onclick=()=>{currentDate=d;callback()};
  box.appendChild(b);
 });
}

function renderBulletin(){
 const el=document.getElementById("bulletinText");
 if(el && document.activeElement!==el) el.value=bulletin||"";
}
async function saveBulletin(){
 const el=document.getElementById("bulletinText");
 if(!el)return;
 bulletin=el.value;
 await save();
 const st=document.getElementById("bulletinStatus");
 if(st){st.textContent="更新しました";setTimeout(()=>{st.textContent=""},1500);}
}

function renderSchedule(){
 renderDateTabs("scheduleDates",renderSchedule);
 const table=document.getElementById("scheduleTable");
 table.innerHTML="<tr><th>時間</th>"+POSITIONS.map(p=>`<th>${p}</th>`).join("")+"</tr>";
 TIMES.forEach((time,ti)=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`<td class="time">${time}</td>`;
  POSITIONS.forEach(p=>{
   const td=document.createElement("td");
   td.className="shift-cell";
   const key=`${currentDate}|${ti}|${p}`;
   if(assignments[key]){
    td.classList.add("assigned");
    const n=assignments[key], g=memberGrades[n]||"";
    td.classList.add(g==="幹部"?"grade-exec-cell":"grade-"+g.replace("年","")+"-cell");
    td.textContent=n;
   }
   tr.appendChild(td);
  });
  table.appendChild(tr);
 });
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[ch]));
}

function renderMembers(){
 const list=document.getElementById("memberList");
 if(!list)return;
 list.innerHTML="";
 if(!Array.isArray(members) || !members.length){list.innerHTML='<p class="small">まだメンバーが登録されていません。</p>';return;}
 members.forEach(name=>{
  const b=document.createElement("button"); b.className="member-btn";
  const grade=memberGrades[name]||"未設定";
  b.innerHTML=`${escapeHtml(name)} <span class="member-grade">${escapeHtml(grade)}</span>`;
  b.onclick=()=>openMember(name); list.appendChild(b);
 });
}

async function addMember(){
 const input=document.getElementById("memberName");
 const grade=document.getElementById("memberGrade").value;
 const name=input.value.trim();
 if(!name)return;
 if(members.includes(name)){alert("同じ名前がすでに登録されています。");return;}
 members.push(name);
 memberGrades[name]=grade;
 input.value="";
 renderMembers();
 await save();
}

function openMember(name){
 currentMember=name;
 document.getElementById("memberListView").style.display="none";
 document.getElementById("memberDetailView").classList.add("active");
 document.getElementById("memberTitle").textContent=`${name} さんの勤務可能時間`;
 document.getElementById("registerStatus").textContent="";
 renderPersonalTable();
}

function closeMember(){
 currentMember=null;
 document.getElementById("memberDetailView").classList.remove("active");
 document.getElementById("memberListView").style.display="block";
 renderMembers();
}

function renderPersonalTable(){
 const table=document.getElementById("personalTable");
 table.innerHTML="<tr><th>時間</th>"+DATES.map(d=>`<th>${d}</th>`).join("")+"</tr>";

 TIMES.forEach((time,ti)=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`<td class="time">${time}</td>`;

  DATES.forEach(d=>{
   const td=document.createElement("td");
   td.className="personal-cell";

   const availabilityKey=`${currentMember}|${d}|${ti}`;
   if(availability[availabilityKey]) td.classList.add("selected");

   // 管理者がこの人をどこかの担当に確定しているか確認
   const assignedPositions=POSITIONS.filter(pos=>{
     return assignments[`${d}|${ti}|${pos}`]===currentMember;
   });

   if(assignedPositions.length){
     td.classList.add("confirmed");
     td.title=`シフト確定：${assignedPositions.join("・")}`;
     td.dataset.confirmed="1";
   }else{
     td.onclick=()=>td.classList.toggle("selected");
   }

   tr.appendChild(td);
  });

  table.appendChild(tr);
 });

 // 確定シフトの説明を表示
 let note=document.getElementById("confirmedNote");
 if(!note){
   note=document.createElement("div");
   note.id="confirmedNote";
   note.className="confirmed-note";
   table.parentElement.parentElement.appendChild(note);
 }
 const confirmedCount=Object.entries(assignments).filter(([key,name])=>{
   const [d,ti,pos]=key.split("|");
   return name===currentMember;
 }).length;

 note.textContent=confirmedCount
   ? `🔵 青色の「シフト確定」は、管理者があなたを実際の担当として決定した時間です。`
   : `🔵 管理者がシフトを確定すると、この画面に「シフト確定」と表示されます。`;
}

function registerAvailability(){
 if(!currentMember)return;

 const cells=document.querySelectorAll(".personal-cell");
 let i=0;

 TIMES.forEach((time,ti)=>{
  DATES.forEach(d=>{
   const key=`${currentMember}|${d}|${ti}`;
   const cell=cells[i++];

   // 既に管理者が確定した時間は、勤務可能情報を変更しない
   const confirmed=POSITIONS.some(pos=>assignments[`${d}|${ti}|${pos}`]===currentMember);

   if(!confirmed){
     availability[key]=cell.classList.contains("selected");
   }
  });
 });

 save();
 document.getElementById("registerStatus").textContent="勤務可能時間を登録しました。";
 renderPersonalTable();
}

function deleteCurrentMember(){
 if(!currentMember)return;
 if(!confirm(`${currentMember} さんを削除しますか？`))return;
 members=members.filter(x=>x!==currentMember);
 delete memberGrades[currentMember];
 Object.keys(availability).forEach(k=>{
  if(k.startsWith(currentMember+"|"))delete availability[k];
 });
 Object.keys(assignments).forEach(k=>{
  if(assignments[k]===currentMember)delete assignments[k];
 });
 save();
 closeMember();
}

const ADMIN_PIN="1111";
function adminLogin(){
 const pin=document.getElementById("adminPin").value;
 if(pin===ADMIN_PIN){
  sessionStorage.setItem("one_make_admin","1");
  document.getElementById("adminLogin").style.display="none";
  document.getElementById("adminContent").style.display="block";
  setupAdmin(); renderAdmin();
 }else document.getElementById("loginStatus").textContent="パスコードが違います。";
}
function adminLogout(){
 sessionStorage.removeItem("one_make_admin");
 document.getElementById("adminContent").style.display="none";
 document.getElementById("adminLogin").style.display="block";
 document.getElementById("adminPin").value="";
}
function checkAdminLogin(){
 const ok=sessionStorage.getItem("one_make_admin")==="1";
 document.getElementById("adminLogin").style.display=ok?"none":"block";
 document.getElementById("adminContent").style.display=ok?"block":"none";
}
function setupAdmin(){
 const d=document.getElementById("adminDate");
 const t=document.getElementById("adminTime");
 const p=document.getElementById("adminPosition");
 if(!d.options.length)DATES.forEach(x=>{
  const o=document.createElement("option");o.value=x;o.textContent=x;d.appendChild(o);
 });
 if(!t.options.length)TIMES.forEach((x,i)=>{
  const o=document.createElement("option");o.value=i;o.textContent=x;t.appendChild(o);
 });
 if(!p.options.length)POSITIONS.forEach(x=>{
  const o=document.createElement("option");o.value=x;o.textContent=x;p.appendChild(o);
 });
 d.value=currentDate;
 d.onchange=renderAdmin;
 t.onchange=renderAdmin;
 p.onchange=renderAdmin;
}

function renderAdmin(){
 const d=document.getElementById("adminDate").value;
 const ti=Number(document.getElementById("adminTime").value);
 const pos=document.getElementById("adminPosition").value;
 currentDate=d;
 adminSelectedMember="";
 const list=document.getElementById("candidateList");
 list.innerHTML="";
 const candidates=members.filter(name=>availability[`${name}|${d}|${ti}`]);
 if(!candidates.length){
  list.innerHTML='<span class="small">この時間に勤務可能と提出したメンバーはいません。</span>';
 }else{
  candidates.forEach(name=>{
   const b=document.createElement("button");
   b.className="candidate";
   b.textContent=name;
   b.onclick=()=>{
    adminSelectedMember=name;
    document.querySelectorAll(".candidate").forEach(x=>x.classList.remove("selected"));
    b.classList.add("selected");
   };
   list.appendChild(b);
  });
 }
 const key=`${d}|${ti}|${pos}`;
 const assigned=assignments[key];
 document.getElementById("adminStatus").textContent=
  assigned?`現在の担当：${assigned}`:"現在、この枠には担当者が設定されていません。";
 renderAdminTable();
 renderDateTabs("adminDates",renderAdmin);
}

function assignSelected(){
 if(!adminSelectedMember){
  alert("勤務可能なメンバーを選択してください。");
  return;
 }
 const d=document.getElementById("adminDate").value;
 const ti=Number(document.getElementById("adminTime").value);
 const pos=document.getElementById("adminPosition").value;
 const conflict=Object.entries(assignments).some(([key,name])=>{
  const [kd,kti,kpos]=key.split("|");
  return kd===d && Number(kti)===ti && name===adminSelectedMember && kpos!==pos;
});
if(conflict){
  alert(`${adminSelectedMember} さんはこの時間にすでに別の仕事が割り当てられています。`);
  return;
}
assignments[`${d}|${ti}|${pos}`]=adminSelectedMember;
 save();
 document.getElementById("adminStatus").textContent=
  `${adminSelectedMember} さんを ${pos} に割り当てました。`;
 renderAdminTable();
 renderSchedule();
 if(currentMember) renderPersonalTable();
}

function clearAssignment(){
 const d=document.getElementById("adminDate").value;
 const ti=Number(document.getElementById("adminTime").value);
 const pos=document.getElementById("adminPosition").value;
 delete assignments[`${d}|${ti}|${pos}`];
 save();
 document.getElementById("adminStatus").textContent="割り当てを解除しました。";
 renderAdminTable();
 renderSchedule();
 if(currentMember) renderPersonalTable();
}

function renderAdminTable(){
 const table=document.getElementById("adminTable");
 table.innerHTML="<tr><th>時間</th>"+POSITIONS.map(p=>`<th>${p}</th>`).join("")+"</tr>";
 TIMES.forEach((time,ti)=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`<td class="time">${time}</td>`;
  POSITIONS.forEach(p=>{
   const td=document.createElement("td");
   td.className="admin-cell";
   const key=`${currentDate}|${ti}|${p}`;
   if(assignments[key]){
    td.classList.add("assigned");
    const n=assignments[key], g=memberGrades[n]||"";
    td.classList.add(g==="幹部"?"grade-exec-cell":"grade-"+g.replace("年","")+"-cell");
    td.textContent=n;
   }
   td.onclick=()=>{
    document.getElementById("adminDate").value=currentDate;
    document.getElementById("adminTime").value=ti;
    document.getElementById("adminPosition").value=p;
    renderAdmin();
   };
   tr.appendChild(td);
  });
  table.appendChild(tr);
 });
}

renderBulletin();
renderSchedule();
renderMembers();
loadCloudData();
</script>

<section id="admin" class="page">
  <div id="adminLogin">
    <h2>管理者ログイン</h2>
    <p class="hint">管理者用パスコードを入力してください。</p>
    <input id="adminPin" type="password" placeholder="パスコード" style="width:100%;padding:13px;border:1px solid #bbb;border-radius:8px;font-size:18px">
    <button class="primary" style="width:100%;margin-top:10px" onclick="adminLogin()">ログイン</button>
    <div id="loginStatus" class="status"></div>
  </div>
  <div id="adminContent" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center">
  <h2>管理者</h2><button class="clear" style="width:auto" onclick="adminLogout()">ログアウト</button>
  </div>
  <p class="hint">提出された勤務可能時間を確認し、管理者が担当場所を決定します。</p>

  <div class="admin-panel">
    <div class="admin-grid">
      <div>
        <label>日付</label>
        <select id="adminDate"></select>
      </div>
      <div>
        <label>時間</label>
        <select id="adminTime"></select>
      </div>
      <div>
        <label>担当場所</label>
        <select id="adminPosition"></select>
      </div>
    </div>

    <div class="candidate-title">この時間に勤務可能なメンバー</div>
    <div id="candidateList" class="candidate-list"></div>
    <button class="primary" onclick="assignSelected()">選択した人を割り当てる</button>
    <button class="clear" onclick="clearAssignment()">この枠の割り当てを解除</button>
    <div id="adminStatus" class="status"></div>
  </div>

  <h3>確定シフト</h3>
  <div class="date-tabs" id="adminDates"></div>
  <div class="table-wrap"><table id="adminTable"></table></div>
  </div>
</section>

</body>
